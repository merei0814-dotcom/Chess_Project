[project]
name = "chess-ai-coach-backend"
version = "0.1.0"
description = "FastAPI backend for CHESS AI COACH"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-chess==1.999",
    "SQLAlchemy>=2.0.44,<2.1",
    "psycopg[binary]>=3.2.10,<3.4",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
